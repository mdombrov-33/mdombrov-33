name: Refresh project cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'  # Every day, UTC. Scheduled workflows may be delayed.

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render cards using live GitHub repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_projects.py
      - name: Commit cards only when content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh project cards"
            git push
          fi
